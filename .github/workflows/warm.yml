name: Warm data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages and data
        env:
          SITE: https://stackwatch-neon.vercel.app
        run: |
          for p in / /dollars /stocks /how; do echo "$p $(curl -s -o /dev/null -w '%{http_code} %{time_total}s' $SITE$p)"; done
          curl -s -w '\nHTTP %{http_code} in %{time_total}s\n' "$SITE/api/data" -o data.json
          curl -sS -o /dev/null -w 'tidewatch history HTTP %{http_code} redirect=%{redirect_url}\n' 'https://www.usetidewatch.org/api/stock-history?symbol=NVDA'
          curl -sL 'https://www.usetidewatch.org/api/stock-history?symbol=NVDA' | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const p=JSON.parse(s).points||[];console.log("tidewatch NVDA points",p.length,p[0]&&new Date(p[0][0]).toISOString(),p.length&&new Date(p[p.length-1][0]).toISOString())}catch(e){console.log("tidewatch history:",s.slice(0,200))}})'
          node -e '
            const d = require("./data.json");
            console.log("errors:", d.errors, "server ms:", d.ms);
            const D = d.dollars;
            if (D){ console.log("T-bill", D.tbill, "yields", D.count, "tvl", D.tvl);
              for (const c of D.cats) console.log(" ", c.id, c.median, c.count, c.options.map(o => o.name + " " + o.apy).join(" | ")); }
            for (const s of d.stocks || []) console.log(" ", s.ticker, s.sym, s.price, s.share, s.gap != null ? (s.gap * 100).toFixed(2) + "%" : "-", s.liquidity, s.week ? (s.week.change * 100).toFixed(2) + "%" : "no week");
          '
